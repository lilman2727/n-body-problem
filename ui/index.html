<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>N-Body Simulator</title>
    <style>
        /* --- BASIC SETUP --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex; /* Zásadní pro rozložení vedle sebe */
        }

        /* --- LEFT SIDEBAR --- */
        .sidebar {
            width: 300px;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Roztlačí obsah nahoru a dolů */
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .sidebar-top h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        hr { border: 0; border-top: 1px solid #444; margin-bottom: 20px; }

        /* Control items */
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #bbb; }
        .control-row { display: flex; align-items: center; justify-content: space-between; }

        input[type="number"], input[type="color"] {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }
        input[type="number"]:focus { border-color: #00ffcc; }

        /* Wrapper for checkboxes */
        .color-section {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .stat-value { font-size: 20px; font-weight: bold; color: #00ffcc; }

        /* StartStop button */
        #playPauseBtn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            background-color: #00ffcc;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        #playPauseBtn:hover { background-color: #00cca3; }
        #playPauseBtn:active { transform: scale(0.98); }
        #playPauseBtn.paused { background-color: #ff4444; color: #fff; }

        /* --- RIGHT SIDE (CANVAS) --- */
        .canvas-container {
            flex-grow: 1; /* Will eat up the rest of the page */
            position: relative;
            background-color: #101010; /* Black bg for the 'universe' */
        }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

<!-- LEFT PANEL -->
<aside class="sidebar">
    <div class="sidebar-top">
        <h1>N-Body<br>Simulator</h1>
        <hr>

        <div class="control-group">
            <label for="massInput">Body weight (x 10^14 kg):</label>
            <input type="number" id="massInput" value="1" step="0.5">
        </div>
        <div class="control-group control-row" style="margin-top: 15px;">
            <label style="margin-bottom: 0; cursor: pointer;" for="movableCheck">Movable body?</label>
            <input type="checkbox" id="movableCheck" checked>
        </div>

        <div class="control-group control-row">
            <label>No. Bodies:</label>
            <span class="stat-value" id="bodyCount">0</span>
        </div>

        <div class="color-section">
            <div class="control-group control-row" style="margin-bottom: 10px;">
                <label style="margin-bottom: 0; cursor: pointer;" for="customColorCheck">Custom color</label>
                <input type="checkbox" id="customColorCheck">
            </div>

            <div class="control-group" id="colorPickerContainer" style="opacity: 0.4; pointer-events: none; margin-bottom: 0;">
                <label for="bodyColor">Color wheel:</label>
                <input type="color" id="bodyColor" value="#00ffcc">
            </div>
        </div>
        <div class="color-section" style="margin-top: 15px;">
            <div class="control-group control-row" style="margin-bottom: 10px;">
                <label style="margin-bottom: 0; cursor: pointer;" for="trailsCheck">Show trail</label>
                <input type="checkbox" id="trailsCheck" checked>
            </div>

            <div class="control-group" id="trailLengthContainer" style="margin-bottom: 0;">
                <label for="trailLengthInput">Trail length:</label>
                <input type="number" id="trailLengthInput" value="60" step="10" min="0">
            </div>
        </div>
    </div>


    <div class="sidebar-bottom">
        <button id="resetBtn" style="width: 100%; padding: 10px; margin-bottom: 10px; font-weight: bold; background-color: #ff4444; color: #fff; border: none; border-radius: 5px; cursor: pointer;">RESET</button>
        <button id="playPauseBtn">PLAY</button>
    </div>
</aside>

<!-- RIGHT PANEL -->
<main class="canvas-container" id="canvasWrapper">
    <canvas id="simCanvas"></canvas>
</main>

<script>
    // --- CANVAS SETUP ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    // Dynamic resizing of the canvas
    function resizeCanvas() {
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); // Call on each resize so the size updates correctly

    // --- CONTROL UI LOGIC ---
    const customColorCheck = document.getElementById('customColorCheck');
    const colorPickerContainer = document.getElementById('colorPickerContainer');
    const bodyColor = document.getElementById('bodyColor');

    // Darkening/unlocking elements
    customColorCheck.addEventListener('change', function() {
        if (this.checked) {
            colorPickerContainer.style.opacity = '1';
            colorPickerContainer.style.pointerEvents = 'auto';
        } else {
            colorPickerContainer.style.opacity = '0.4';
            colorPickerContainer.style.pointerEvents = 'none';
        }
    });

    // Play/Pause button
    let isSimRunning = false;
    const playPauseBtn = document.getElementById('playPauseBtn');

    playPauseBtn.addEventListener('click', function() {
        isSimRunning = !isSimRunning;
        if (isSimRunning) {
            this.innerText = "PAUSE";
            this.classList.add('paused');
        } else {
            this.innerText = "PLAY";
            this.classList.remove('paused');
        }

        if (typeof startStopSim !== 'undefined') {
            startStopSim(isSimRunning);
        }
    });

    // Helper function to convert between hex and rgb
    function hexToRgb(hex) {
        return [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16)
        ];
    }

    // --- Backend connections ---
    let lastClickTime = 0;

    canvas.addEventListener('click', function(event) {
        let currentTime = Date.now();
        if(currentTime - lastClickTime <= 100) { return; } // 100ms timeout to not overwhelm the backend
        lastClickTime = currentTime;

        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const massValue = Number(document.getElementById('massInput').value);
        const isMovable = document.getElementById('movableCheck').checked;

        if (typeof addBody !== 'undefined') {
            if (customColorCheck.checked) {
                // Also send the custom color if the 'custom color' checkbox is checked
                const rgb = hexToRgb(bodyColor.value);
                addBody(x, y, massValue, isMovable, rgb[0], rgb[1], rgb[2]);
            } else {
                // Else just send basic data, and the backend will assign a random color
                addBody(x, y, massValue, isMovable);
            }
        }
    });

    // Called by backend to update the position of bodies
    const trailsCheck = document.getElementById('trailsCheck');
    const trailLengthInput = document.getElementById('trailLengthInput');
    const trailLengthContainer = document.getElementById('trailLengthContainer');

    trailsCheck.addEventListener('change', function() {
        if (this.checked) {
            trailLengthContainer.style.opacity = '1';
            trailLengthContainer.style.pointerEvents = 'auto';
        } else {
            trailLengthContainer.style.opacity = '0.4';
            trailLengthContainer.style.pointerEvents = 'none';
            trails = [];
        }
    });

    let trails = [];
    let previousBodyCount = 0;
    function updateBodies(bodies) {
        document.getElementById('bodyCount').innerText = bodies.length;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Get current state
        const showTrails = trailsCheck.checked;
        const maxTrailLength = Number(trailLengthInput.value);

        if (bodies.length < previousBodyCount) {
            trails = [];
        }
        previousBodyCount = bodies.length;

        if (showTrails) {
            while (trails.length < bodies.length) trails.push([]);
            if (trails.length > bodies.length) trails.length = bodies.length;
        } else {
            trails = [];
        }

        bodies.forEach((body, index) => {
            if (showTrails) {

                trails[index].push({ x: body.x, y: body.y });

                while (trails[index].length > maxTrailLength) {
                    trails[index].shift();
                }

                // Drawing the trails
                if (trails[index].length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(trails[index][0].x, trails[index][0].y);
                    for (let i = 1; i < trails[index].length; i++) {
                        ctx.lineTo(trails[index][i].x, trails[index][i].y);
                    }

                    ctx.strokeStyle = `rgba(${body.r}, ${body.g}, ${body.b}, 0.4)`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // Drawing the body
            ctx.fillStyle = `rgb(${body.r}, ${body.g}, ${body.b})`;
            ctx.beginPath();
            ctx.arc(body.x, body.y, 5 * scale(body.mass), 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function logScale(num)
    {
        if(num < 0){num = -num;}
        return Math.log(num) / Math.log(1e14);
    }
    function scale(mass)
    {
        if(mass >= 1e14)
        {
            return logScale(mass) ** 3;
        }
        else
        {
            return logScale(mass) ** (1/3);
        }

    }

    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', function() {
        // Zavoláme C++ funkci
        if (typeof resetSim !== 'undefined') {
            resetSim();
        }

        // Volitelně můžeme rovnou zastavit i simulaci, pokud běžela
        if (isSimRunning) {
            playPauseBtn.click(); // Simulujeme kliknutí na play/pause pro vypnutí
        }
    });
</script>
</body>
</html>
